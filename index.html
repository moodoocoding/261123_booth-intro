<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청주소로초등학교 디지털마스터 · 우리가 만든 게임 소개</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===========================================
   색과 글꼴 (여기만 바꾸면 전체 분위기가 바뀌어요)
   =========================================== */
:root{
  --stage-bg:#efece3;       /* 화면 비율이 안 맞을 때 바깥 여백 색 */
  --slide-bg:#faf8f2;       /* 슬라이드 바탕 (크림색) */
  --ink:#1b2444;            /* 글자, 남색 패널 */
  --sub:#4a5270;
  --desc:#3a4263;          /* 설명 글자 */
  --line:#dedad0;
  --blue:#3550e0;           /* 강조 버튼 */
  --lime:#d9f65c;           /* 꼬리표 */
  --band:#f0eee5;           /* 아래 띠 */
  --font:'Gothic A1','Malgun Gothic',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --auto-ms:10000ms;        /* 자동으로 넘어가는 시간 (10초 = 10000ms) */
}
*{margin:0;padding:0;box-sizing:border-box}

/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }
    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }
    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }
    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }
    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }
    .deck-controls {
        display: none !important;
    }
}
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   화면 구성 (볼 것은 두 가지뿐: 게임 소개와 QR 코드)
   색의 역할을 나눴어요:
     남색 = 제목과 게임 화면 틀 / 파랑 = "지금 해보기"(QR)와 진행 막대만 / 연두 = 분류 꼬리표만
   배치 기준선 (1920×1080):
     글 칸 x 110~860 · 게임 화면 x 950~1810 · 꼬리표 위쪽은 모든 장에서 y 300
   =========================================== */
body{font-family:var(--font);color:var(--ink)}
.slide{transition:opacity .5s ease}
.chrome{position:absolute;inset:0;z-index:5;pointer-events:none}
.brand{position:absolute;left:110px;top:136px;transform:translateY(-50%);font-size:28px;font-weight:700;color:var(--desc);letter-spacing:-.3px;white-space:nowrap}
.brand b{color:var(--ink);font-weight:900;margin-right:16px}

/* ----- 오른쪽 위 QR 블록: 이 화면에서 유일한 "해 보세요" 색(파랑) -----
   슬라이드가 바뀌면 그 게임의 QR 코드로 부드럽게 바뀌어요 */
.qr{position:absolute;left:1390px;top:50px;width:420px;height:172px;padding:12px 12px 12px 32px;border-radius:28px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:space-between}
.qr .txt{font-size:38px;font-weight:900;line-height:1.2;letter-spacing:-1px;white-space:nowrap}
.qr .txt small{display:block;font-size:24px;font-weight:700;color:rgba(255,255,255,.85);margin-bottom:6px;letter-spacing:0}
.qr .box{width:148px;height:148px;border-radius:14px;background:#fff;position:relative;overflow:hidden;flex:none}
.qr .code{position:absolute;inset:8px;opacity:0;transition:opacity .3s ease}
.qr .code.on{opacity:1}
.qr .code img,.qr .code canvas{width:100%!important;height:100%!important;max-width:none;max-height:none;display:block}

/* ----- 맨 아래 진행 막대: 바탕 줄 없이 파란 줄만 10초 동안 차올라요 ----- */
.bar{position:absolute;left:0;right:0;bottom:0;height:6px}
.bar i{display:block;height:100%;background:var(--blue);transform:scaleX(0);transform-origin:0 50%}
.bar i.run{animation:fill var(--auto-ms) linear forwards}
.paused .bar i.run{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}

/* ----- 왼쪽: 게임 소개 (위에서부터 차례로, 모든 장에서 같은 높이에서 시작) ----- */
.left{position:absolute;left:110px;top:300px;width:750px}
.tag{display:inline-block;background:var(--lime);padding:12px 24px;border-radius:12px;font-size:32px;font-weight:800;white-space:nowrap}
.tag em{font-style:normal;opacity:.4;margin:0 8px}
h1{font-size:140px;line-height:1.08;font-weight:900;letter-spacing:-.04em;margin:28px 0 36px;white-space:pre-line;word-break:keep-all}
h1.one{font-size:150px;line-height:1.1}
.desc{font-size:38px;line-height:1.5;font-weight:600;color:var(--desc);max-width:750px;word-break:keep-all;text-wrap:balance}

/* ----- 오른쪽: 게임 화면 (밝은 화면이든 어두운 화면이든 같은 틀) ----- */
.panel{position:absolute;left:950px;top:270px;width:860px;height:700px;border-radius:36px;background:var(--ink);padding:22px;box-shadow:0 30px 60px -24px rgba(27,36,68,.35)}
.shot{width:100%;height:100%;border-radius:18px;overflow:hidden;background:#e9e6dc;box-shadow:0 0 0 2px rgba(255,255,255,.16)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.wall{width:100%;height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:12px}
.wall div{border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.16)}
.wall img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.wall .more{background:var(--lime);display:grid;place-items:center;font-size:44px;font-weight:900;line-height:1.2;text-align:center;box-shadow:none}

/* ===========================================
   등장 효과: 글은 살짝 올라오고, 게임 화면은 제자리에서 떠올라요
   (학교 이름과 QR 블록은 움직이지 않아요)
   =========================================== */
.rv{opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.slide.visible .rv{opacity:1;transform:none}
.slide.visible .rv:nth-child(2){transition-delay:.08s}
.slide.visible .rv:nth-child(3){transition-delay:.16s}
.panel.rv{transform:scale(.985);transition-duration:.7s}
.slide.visible .panel.rv{transition-delay:.1s}
</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
    <!-- 슬라이드는 아래 스크립트의 GAMES 목록으로 만들어져요 -->
    <div class="chrome" id="chrome">
      <div class="brand"><b>청주소로초등학교 디지털마스터</b>2026 충북 AI 페스티벌</div>
      <div class="qr" id="qr"><div class="txt"><small>휴대폰 카메라로</small>지금 해보기</div><div class="box" id="qrBox"></div></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </main>
</div>

<script>
/* ===========================================
   소개할 게임 목록
   한 줄을 더하면 슬라이드가 한 장 늘어나요.
   shot: shots 폴더의 화면 사진 이름, url: QR 코드로 열릴 주소
   title: 크게 보이는 게임 이름 (\n 은 줄바꿈), desc: 한 줄 설명
   =========================================== */
// 게임 주소 (QR 코드가 가리키는 곳). 부스 모음 사이트의 게임별 주소를 써요.
const HUB = 'https://ai-festival-booth.vercel.app/';
const GAMES = [
  {shot:'spacing',url:HUB+'games/spacing-champion/',subj:'국어',name:'띄어쓰기 1등은 누구?',title:'띄어쓰기\n1등은 누구?',desc:'글자 사이를 눌러 알맞게 띄어 써요. 최대 4명이 동시에 겨뤄요.',players:'1~4명',rank:true},
  {shot:'fight',url:HUB+'games/math-fighter/',subj:'수학',name:'수학격투',title:'수학격투',desc:'곱셈 문제를 풀어 필살기를 날리는 격투 게임이에요.',players:'1~2명',rank:true},
  {shot:'gugudan',url:'https://261123-gugudan-guardians.vercel.app/',subj:'수학',name:'구구단 가디언즈',title:'구구단\n가디언즈',desc:'구구단을 맞혀 탑을 세우고 몰려오는 적을 막아요.',players:'1명',rank:true},
  {shot:'space',url:HUB+'games/space-conqueror/',subj:'과학',name:'우주정복자',title:'우주정복자',desc:'태양계 여덟 행성을 찾아가 퀴즈를 풀고 정복해요.',players:'1명',rank:true},
  {shot:'weather',url:HUB+'games/weather-simulator/',subj:'과학',name:'꼬마 기상청장',title:'꼬마\n기상청장',desc:'해, 비, 눈, 바람을 직접 바꿔 보며 날씨를 알아봐요.',players:'1명',rank:false},
  {shot:'capital',url:HUB+'games/capital-quiz/',subj:'사회',name:'나라 수도 맞추기',title:'나라 수도\n맞추기',desc:'세계 50개 나라의 사진과 국기를 보고 수도를 골라요.',players:'1명',rank:true},
  {shot:'quiz',url:HUB+'games/triple-quiz-show/',subj:'퀴즈',name:'트리플 퀴즈 쇼',title:'트리플\n퀴즈 쇼',desc:'상식, 연산, 아재개그 세 라운드로 이어지는 퀴즈 쇼예요.',players:'1~2명',rank:true},
  {shot:'runner',url:HUB+'games/quiz-runner/',subj:'퀴즈',name:'퀴즈 & 점프 런너',title:'퀴즈 &\n점프 런너',desc:'장애물은 점프로 넘고, 퀴즈를 맞히면 더 빨라져요.',players:'1~4명',rank:true},
  {shot:'brain',url:HUB+'games/brain-dash/',subj:'두뇌',name:'브레인 대시',title:'브레인\n대시',desc:'색깔, 암산, 기억력 게임으로 딱 1분 두뇌를 깨워요.',players:'1명',rank:true},
  {shot:'block',url:HUB+'games/block-puzzle/',subj:'두뇌',name:'블록 퍼즐 챔피언',title:'블록 퍼즐\n챔피언',desc:'블록을 놓아 가로줄이나 세로줄을 꽉 채우면 지워져요.',players:'1명',rank:true},
  {shot:'swing',url:HUB+'games/rope-swing/',subj:'액션',name:'휙휙! 로프 스윙',title:'휙휙!\n로프 스윙',desc:'로프를 걸고 흔들흔들 날아서 끝까지 건너가요.',players:'1명',rank:true},
  {shot:'beat',url:HUB+'games/beat-smash/',subj:'액션',name:'비트스매시 클럽',title:'비트스매시\n클럽',desc:'음악에 맞춰 떨어지는 노트를 딱 맞는 순간에 눌러요.',players:'1명',rank:true},
  {shot:'core',url:HUB+'games/core-defense/',subj:'액션',name:'택티컬 코어 디펜스',title:'택티컬\n코어 디펜스',desc:'몰려오는 드론을 물리치며 코어를 지키는 슈팅 게임이에요.',players:'1명',rank:true}
];
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===========================================
   슬라이드 만들기: 첫 장(전체 소개) + 게임마다 한 장
   =========================================== */
const stage = document.getElementById('deckStage'), chrome = document.getElementById('chrome');
const cover = `<section class="slide">
  <div class="left">
    <span class="tag rv">초등학생이 AI와 함께 만들었어요</span>
    <h1 class="rv">우리가 만든\n게임 ${GAMES.length}개.</h1>
    <p class="desc rv">마음에 드는 게임을 골라 직접 해 보세요!</p>
  </div>
  <div class="panel rv"><div class="wall">${GAMES.slice(0,11).map(g=>`<div><img src="shots/${g.shot}.png" alt=""></div>`).join('')}<div class="more">+${GAMES.length-11}<br>더!</div></div></div>
</section>`;
const slidesHtml = GAMES.map(g=>`<section class="slide">
  <div class="left">
    <span class="tag rv">${esc(g.subj)}<em>·</em>${esc(g.players)}${g.rank?'<em>·</em>🏆 랭킹 도전':''}</span>
    <h1 class="rv ${g.title.includes('\n')?'':'one'}">${esc(g.title)}</h1>
    <p class="desc rv">${esc(g.desc)}</p>
  </div>
  <div class="panel rv"><div class="shot"><img src="shots/${g.shot}.png" alt="${esc(g.name)} 화면"></div></div>
</section>`).join('');
chrome.insertAdjacentHTML('beforebegin',cover+slidesHtml);

/* ===========================================
   QR 코드: 장마다 하나씩 미리 만들어 두고, 슬라이드가 바뀌면 바꿔 보여 줘요
   =========================================== */
const QR_URLS = [HUB,...GAMES.map(g=>g.url)];
const qrBox = document.getElementById('qrBox');
QR_URLS.forEach(u=>{
  const d = document.createElement('div'); d.className = 'code'; qrBox.appendChild(d);
  try{ new QRCode(d,{text:u,width:432,height:432,colorDark:'#111827',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.L}); }catch(e){}   // 인터넷이 없으면 빈 칸으로 남아요
});
function showQR(i){ [...qrBox.children].forEach((c,k)=>c.classList.toggle('on',k===i)); }

/* ===========================================
   슬라이드 조종: 10초마다 자동으로 다음 장, 끝나면 처음으로
   ← → 키로 넘기기, 스페이스로 멈춤/다시 시작, 화면을 누르면 다음 장
   =========================================== */
class SlidePresentation{
  constructor(){
    this.slides = [...document.querySelectorAll('.slide')];
    this.cur = 0; this.paused = false; this.timer = null;
    this.autoMs = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--auto-ms'))||10000;
    this.bar = document.getElementById('bar');
    this.setupStageScale(); this.setupKeyboardNav(); this.setupTouchNav();
    this.showSlide(0);
  }
  // 1920×1080 무대를 통째로 화면에 맞춰 키우거나 줄여요 (내용 배치는 바뀌지 않아요)
  setupStageScale(){
    const scale = ()=>{
      const f = Math.min(innerWidth/1920,innerHeight/1080), x = (innerWidth-1920*f)/2, y = (innerHeight-1080*f)/2;
      stage.style.transform = `translate(${x}px, ${y}px) scale(${f})`;
    };
    scale(); addEventListener('resize',scale);
  }
  setupKeyboardNav(){
    addEventListener('keydown',e=>{
      if(['ArrowRight','PageDown','Enter'].includes(e.key)){ e.preventDefault(); this.next(); }
      else if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); this.prev(); }
      else if(e.key===' '){ e.preventDefault(); this.togglePause(); }
      else if(e.key==='Home'){ this.showSlide(0); }
    });
    addEventListener('wheel',e=>{ if(Date.now()-(this.wheelAt||0)<600) return; this.wheelAt = Date.now(); e.deltaY>0 ? this.next() : this.prev(); },{passive:true});
  }
  setupTouchNav(){
    let x0 = null;
    addEventListener('touchstart',e=>{ x0 = e.touches[0].clientX; },{passive:true});
    addEventListener('touchend',e=>{ if(x0===null) return; const dx = e.changedTouches[0].clientX-x0; x0 = null; if(Math.abs(dx)>50) dx<0 ? this.next() : this.prev(); else this.next(); });
    addEventListener('click',()=>{ if(!('ontouchstart' in window)) this.next(); });
  }
  next(){ this.showSlide((this.cur+1)%this.slides.length); }
  prev(){ this.showSlide((this.cur-1+this.slides.length)%this.slides.length); }
  togglePause(){
    this.paused = !this.paused; document.body.classList.toggle('paused',this.paused);
    clearTimeout(this.timer); if(!this.paused) this.showSlide(this.cur);
  }
  showSlide(i){
    this.cur = i;
    this.slides.forEach((s,k)=>{ s.classList.toggle('active',k===i); s.classList.toggle('visible',k===i); });
    this.bar.classList.remove('run'); void this.bar.offsetWidth; this.bar.classList.add('run');   // 진행 막대를 처음부터 다시 채워요
    showQR(i);
    clearTimeout(this.timer);
    if(!this.paused) this.timer = setTimeout(()=>this.next(),this.autoMs);
  }
}
const deck = new SlidePresentation();
// 주소 뒤에 ?s=3 을 붙이면 3번째 장부터, &pause=1 을 붙이면 멈춘 채로 열려요 (점검용)
const qs = new URLSearchParams(location.search);
if(qs.get('pause')) deck.togglePause();
if(qs.get('s')) deck.showSlide(Math.max(0,Math.min(deck.slides.length-1,(parseInt(qs.get('s'))||1)-1)));
</script>
</body>
</html>
